name: Cerca de pisos

on:
  # Execució automàtica diària. Minut "estrany" a propòsit: GitHub endarrereix
  # molt els crons a l'hora en punt (amb "0 6" arrencava entre les 10 i les 15 UTC).
  schedule:
    - cron: "23 4 * * *"
  # Execució manual des de la pestanya Actions (botó "Run workflow")
  workflow_dispatch:
    inputs:
      zona:
        description: "'auto' = les zones que toquen avui (BCN i Barcelonès nord cada dia, la resta cada 2-3 dies); 'totes' = totes; o una clau (bcn-gracia, badalona, terrassa...)."
        required: false
        default: "auto"

jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar el repo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instal·lar dependències
        run: pip install requests beautifulsoup4

      - name: Executar la cerca a Habitaclia
        env:
          # La clau surt del secret del repo, MAI del codi
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python cerca_pisos_habitaclia.py "${{ github.event.inputs.zona || 'auto' }}"

      - name: Executar la cerca a Fotocasa
        # s'executa encara que Habitaclia hagi fallat (el job queda en vermell igualment)
        if: success() || failure()
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python cerca_pisos_fotocasa.py "${{ github.event.inputs.zona || 'auto' }}"
